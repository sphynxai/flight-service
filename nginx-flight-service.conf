# Nginx reverse proxy for Flight Service
# Location: /usr/local/etc/nginx/vhosts/flight-service.conf (FreeBSD)
#           or /etc/nginx/sites-available/flight-service.conf (Linux)

upstream flight_service {
    server 127.0.0.1:3003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name flight-service.afscdevs.com flight-service.kbmsolvedit.net localhost;

    # Redirect HTTP to HTTPS (after SSL cert configured)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://flight_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support (for phase 2 voice)
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://flight_service;
        proxy_set_header Host $host;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}


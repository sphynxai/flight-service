version: '3.8'

services:
  flight-service:
    build: .
    container_name: flight-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - flight-service-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  flight-service-logs:
    driver: local

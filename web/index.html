<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Service Briefing — AlbertAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 {
      color: #1e3c72;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #333;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2a5298;
      box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .geolocation-badge {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .location-icon { color: #2a5298; }
    button {
      width: 100%;
      padding: 14px;
      background: #2a5298;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    button:hover {
      background: #1e3c72;
    }
    button:active {
      transform: translateY(1px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .briefing-area {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }
    .briefing-text {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 6px;
      line-height: 1.6;
      color: #333;
      font-size: 14px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .section {
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6b7a90;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .station {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .station-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .station-id {
      font-weight: 700;
      color: #1e3c72;
      font-size: 15px;
    }
    .station-name {
      font-size: 12px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cat {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      flex-shrink: 0;
    }
    .cat-VFR  { background: #2e7d32; }
    .cat-MVFR { background: #1565c0; }
    .cat-IFR  { background: #c62828; }
    .cat-LIFR { background: #6a1b9a; }
    .cat-NA   { background: #9e9e9e; }
    .wx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px 14px;
      margin-bottom: 10px;
    }
    .wx-item { font-size: 13px; }
    .wx-label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8a93a0;
    }
    .wx-value { color: #222; font-weight: 500; }
    .raw {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: #55606e;
      background: #eef1f4;
      padding: 8px 10px;
      border-radius: 4px;
      word-break: break-word;
      line-height: 1.5;
    }
    .notam-item {
      font-size: 13px;
      padding: 8px 12px;
      background: #f8f9fa;
      border-left: 3px solid #b0bac6;
      border-radius: 0 4px 4px 0;
      margin-bottom: 6px;
    }
    .notam-airport { font-weight: 600; color: #1e3c72; }
    .badge-mock {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      background: #fff3cd;
      color: #8a6100;
      border: 1px solid #ffe08a;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .advisory {
      font-size: 12px;
      line-height: 1.6;
      color: #5a6472;
      background: #fbfcfd;
      border: 1px solid #e4e9ef;
      border-radius: 6px;
      padding: 12px 14px;
    }
    .advisory strong { color: #1e3c72; }
    .toggle-raw {
      background: none;
      border: none;
      color: #2a5298;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      width: auto;
      margin: 0 0 10px 0;
    }
    .toggle-raw:hover { background: none; text-decoration: underline; }

    .voice-bar {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    button.mic {
      width: auto;
      margin: 0;
      padding: 11px 22px;
      background: #0f7b45;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }
    button.mic:hover { background: #0b5f35; }
    button.mic[disabled] { background: #ccc; }
    button.mic.listening { background: #c62828; }
    .mic-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #fff; opacity: 0.9;
      flex-shrink: 0;
    }
    button.mic.listening .mic-dot { animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      button.mic.listening .mic-dot { animation: none; }
    }
    .voice-hint { font-size: 12px; color: #8a93a0; text-align: center; }
    .heard {
      font-size: 13px;
      color: #1e3c72;
      background: #eef2f8;
      border-radius: 4px;
      padding: 8px 12px;
      font-style: italic;
      text-align: center;
      width: 100%;
    }
    .status {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      text-align: center;
    }
    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .error { color: #d32f2f; }
    .success { color: #388e3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✈️ Flight Service Briefing</h1>
    <p class="subtitle">Weather, NOTAMs & SUA briefing via AlbertAI</p>

    <form id="briefingForm">
      <div class="form-group">
        <label for="departure">Departure Airport (ICAO)</label>
        <input type="text" id="departure" name="departure" placeholder="KAFW" value="KAFW" required>
      </div>

      <div class="form-group">
        <label for="arrival">Arrival Airport (ICAO)</label>
        <input type="text" id="arrival" name="arrival" placeholder="KSPS" value="KSPS" required>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label for="altitude">Cruising Altitude (feet)</label>
          <input type="text" id="altitude" name="altitude" placeholder="4000" value="4000">
        </div>
        <div class="form-group">
          <label for="aircraft">Aircraft Type (optional)</label>
          <input type="text" id="aircraft" name="aircraft" placeholder="C172" value="C172">
        </div>
      </div>

      <div class="form-group">
        <label>Your Location</label>
        <div class="geolocation-badge">
          <span class="location-icon">📍</span>
          <span id="locationStatus">Detecting...</span>
        </div>
        <input type="hidden" id="latitude" name="latitude">
        <input type="hidden" id="longitude" name="longitude">
      </div>

      <button type="submit">Get Briefing</button>
      <div class="status" id="status"></div>
    </form>

    <div class="voice-bar">
      <button type="button" id="micBtn" class="mic">
        <span class="mic-dot" aria-hidden="true"></span>
        <span id="micLabel">Speak your flight</span>
      </button>
      <div class="voice-hint" id="voiceHint">
        Try: &ldquo;Alliance to Wichita Falls at four thousand&rdquo;
      </div>
      <div class="heard" id="heard" hidden></div>
    </div>

    <div class="briefing-area" id="briefingArea" style="display: none;">
      <h3 style="color:#1e3c72; margin-bottom:18px;">Your Briefing</h3>
      <div id="briefingRender"></div>
      <button type="button" class="toggle-raw" id="toggleRaw">Show full briefing text ▾</button>
      <div class="briefing-text" id="briefingText" style="display:none;"></div>
      <div style="margin-top: 16px; text-align: center;">
        <button type="button" id="speakButton" style="background: #ff6b35;">🔊 Read Aloud</button>
      </div>
    </div>
  </div>

  <script>
    // Geolocation setup
    function detectLocation() {
      const statusEl = document.getElementById('locationStatus');
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            document.getElementById('latitude').value = pos.coords.latitude.toFixed(4);
            document.getElementById('longitude').value = pos.coords.longitude.toFixed(4);
            statusEl.textContent = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
          },
          (err) => {
            statusEl.textContent = 'Geolocation denied (manual entry ok)';
            console.warn('Geolocation denied:', err);
          }
        );
      } else {
        statusEl.textContent = 'Browser does not support geolocation';
      }
    }

    // Request briefing
    document.getElementById('briefingForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const departure = document.getElementById('departure').value.toUpperCase();
      const arrival = document.getElementById('arrival').value.toUpperCase();
      const altitude = document.getElementById('altitude').value;
      const aircraft = document.getElementById('aircraft').value.toUpperCase();
      const latitude = parseFloat(document.getElementById('latitude').value);
      const longitude = parseFloat(document.getElementById('longitude').value);

      const statusEl = document.getElementById('status');
      statusEl.innerHTML = '<span class="loading">⏳</span> Fetching briefing...';

      try {
        const response = await fetch('/api/briefing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ departure, arrival, altitude, aircraft, latitude, longitude })
        });

        if (!response.ok) throw new Error('Request failed');
        const data = await response.json();

        // Display briefing
        document.getElementById('briefingText').textContent = data.briefing;
        lastVoice = data.voice || null;
        renderBriefing(data);
        document.getElementById('briefingArea').style.display = 'block';
        statusEl.innerHTML = '<span class="success">✓ Briefing ready</span>';

        // Only auto-speak when the request itself came by voice.
        if (spokenAutomatically) {
          spokenAutomatically = false;
          speak(lastVoice);
        }
      } catch (err) {
        statusEl.innerHTML = `<span class="error">✗ ${err.message}</span>`;
      }
    });

    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Must match the server-side briefing text, which rounds half away from
    // zero (PHP's convention). Math.round(-2.5) is -2 and would print a
    // different sub-zero temp here than in the briefing directly below.
    const roundTemp = (n) => Math.sign(n) * Math.round(Math.abs(n));

    function wxItem(label, value) {
      if (value == null || value === '') return '';
      return `<div class="wx-item"><span class="wx-label">${esc(label)}</span>` +
             `<span class="wx-value">${esc(value)}</span></div>`;
    }

    // Renders only fields NOAA decoded server-side — no METAR parsing here.
    function stationCard(label, icao, m, taf) {
      if (!m) {
        return `<div class="station"><div class="station-head">` +
               `<span class="station-id">${esc(icao)}</span>` +
               `<span class="cat cat-NA">NO DATA</span></div>` +
               `<div class="wx-value" style="font-size:13px;color:#888;">` +
               `${esc(label)} weather unavailable</div></div>`;
      }

      let wind = '—';
      if (m.wdir === 0 && m.wspd === 0) wind = 'Calm';
      else if (m.wspd != null) {
        wind = `${m.wdir === 'VRB' ? 'VRB' : m.wdir + '°'} at ${m.wspd}kt` +
               (m.wgst ? ` G${m.wgst}` : '');
      }

      const ceil = (m.clouds || []).find(c => c.cover === 'BKN' || c.cover === 'OVC');
      const cat = m.fltCat || 'NA';

      return `<div class="station">
        <div class="station-head">
          <span class="station-id">${esc(icao)}</span>
          <span class="cat cat-${esc(cat)}">${esc(cat)}</span>
          <span class="station-name">${esc(m.station || '')}</span>
        </div>
        <div class="wx-grid">
          ${wxItem('Wind', wind)}
          ${wxItem('Visibility', m.visib != null ? m.visib + ' SM' : null)}
          ${wxItem('Ceiling', ceil ? `${ceil.cover} ${ceil.base.toLocaleString()} ft` : 'None reported')}
          ${wxItem('Present wx', m.wxString)}
          ${wxItem('Temp / Dew', m.temp != null ? `${roundTemp(m.temp)}°C / ${roundTemp(m.dewp)}°C` : null)}
          ${wxItem('Altimeter', m.altim != null ? (m.altim / 33.8639).toFixed(2) + ' inHg' : null)}
          ${wxItem('Pressure alt', m.pressureAltitude != null ? m.pressureAltitude.toLocaleString() + ' ft' : null)}
          ${wxItem('Density alt', m.densityAltitude != null ? m.densityAltitude.toLocaleString() + ' ft' : null)}
        </div>
        <div class="raw">${esc(m.raw)}</div>
        ${taf ? `<div class="raw" style="margin-top:6px;">${esc(taf)}</div>` : ''}
      </div>`;
    }

    function windCard(label, w) {
      if (!w || !w.available) {
        return `<div class="notam-item"><span class="notam-airport">${esc(w?.airport || label)}</span>` +
               ` — winds aloft unavailable <span style="color:#8a93a0;">` +
               `(${esc(w?.reason || 'no data')})</span></div>`;
      }
      const wind = w.lightVariable ? 'Light &amp; variable' : `${esc(w.dir)}° at ${esc(w.speed)} kt`;
      // Must be visible when the forecast level differs from the filed altitude.
      const levelText = w.requestedAltitude && w.requestedAltitude !== w.level
        ? `${w.level.toLocaleString()} ft — nearest to filed ${w.requestedAltitude.toLocaleString()} ft`
        : `${w.level.toLocaleString()} ft`;
      return `<div class="station">
        <div class="station-head">
          <span class="station-id">${esc(w.airport)}</span>
          <span class="cat" style="background:#37474f;">FL${String(w.level / 100).padStart(3, '0')}</span>
          <span class="station-name">FB station ${esc(w.station)}${w.substituted ? ' — nearest available' : ''}</span>
        </div>
        <div class="wx-grid">
          ${wxItem('Wind', w.lightVariable ? 'Light & variable' : `${w.dir}° at ${w.speed} kt`)}
          ${wxItem('Temp', w.temp != null ? `${w.temp}°C` : null)}
          ${wxItem('Level', levelText)}
        </div>
        <div class="raw">${esc(w.raw)}${w.validity ? ' · ' + esc(w.validity) : ''}</div>
      </div>`;
    }

    function renderBriefing(data) {
      const w = data.weather || {};
      const winds = data.winds || {};
      const notams = data.notams || [];
      const sua = data.sua || {};
      const cats = [w.departure?.metar?.fltCat, w.arrival?.metar?.fltCat].filter(Boolean);

      const notamsMock = notams.some(n => n.source === 'placeholder');
      const notamHtml = notams.length
        ? notams.map(n => `<div class="notam-item">` +
            `<span class="notam-airport">${esc(n.airport)}</span> — ${esc(n.text)}</div>`).join('')
        : `<div class="notam-item">None reported</div>`;

      const route = [
        data.aircraft ? esc(data.aircraft) : null,
        data.altitude ? `${Number(data.altitude).toLocaleString()} ft` : null
      ].filter(Boolean).join(' · ');

      const hz = data.hazards;
      let hazardHtml;
      if (!hz || !hz.available) {
        hazardHtml = `<div class="notam-item">Adverse conditions not checked ` +
                     `<span style="color:#8a93a0;">(${esc(hz?.reason || 'no data')})</span></div>`;
      } else {
        const items = [];
        const band = (lo, hi) => {
          const f = (n) => n == null ? null : Number(n).toLocaleString() + 'ft';
          if (lo != null && hi != null) return ` ${f(lo)}–${f(hi)}`;
          if (hi != null) return ` up to ${f(hi)}`;
          if (lo != null) return ` above ${f(lo)}`;
          return '';
        };
        for (const s of hz.convectiveSigmets || []) {
          const first = (s.raw || '').split('\n').find(l => l.includes('CONVECTIVE SIGMET')) || 'Convective SIGMET';
          items.push(`<div class="notam-item" style="border-left-color:#c62828;">` +
            `<span class="notam-airport">CONVECTIVE SIGMET</span> — ${esc(first.trim())}` +
            `${esc(band(s.altitudeLow, s.altitudeHigh))}</div>`);
        }
        for (const s of hz.sigmets || []) {
          items.push(`<div class="notam-item" style="border-left-color:#ef6c00;">` +
            `<span class="notam-airport">SIGMET ${esc(s.hazard || '')}</span>` +
            `${esc(band(s.altitudeLow, s.altitudeHigh))}</div>`);
        }
        const byHaz = {};
        for (const g of hz.gairmets || []) (byHaz[g.hazard || 'UNKNOWN'] ||= []).push(g);
        for (const [hazard, list] of Object.entries(byHaz)) {
          // Altitudes already decoded from hundreds-of-feet server-side.
          const tops = list.map(g => g.top?.ft).filter(v => v != null);
          const levels = list.map(g => g.level?.ft).filter(v => v != null);
          const bases = [...new Set(list.map(g => g.base?.label).filter(Boolean))];
          let ext = '';
          if (tops.length) {
            ext = (bases.length === 1 ? ` ${bases[0]} to ` : ' to ') + Math.max(...tops).toLocaleString() + 'ft';
          } else if (levels.length) {
            const lo = Math.min(...levels), hi = Math.max(...levels);
            ext = lo === hi ? ` at ${lo.toLocaleString()}ft` : ` ${lo.toLocaleString()}ft–${hi.toLocaleString()}ft`;
          }
          items.push(`<div class="notam-item" style="border-left-color:#1565c0;">` +
            `<span class="notam-airport">G-AIRMET ${esc(hazard)}</span>${esc(ext)} ` +
            `<span style="color:#8a93a0;">(${list.length})</span></div>`);
        }
        for (const c of hz.cwas || []) {
          items.push(`<div class="notam-item" style="border-left-color:#6a1b9a;">` +
            `<span class="notam-airport">Center Weather Advisory</span> — ` +
            `${esc(c.name || c.cwsu || '')} ${esc(c.hazard || '')}</div>`);
        }
        const pr = hz.pireps || [];
        for (const p of pr.slice(0, 6)) {
          const fl = p.flightLevel != null ? ` ${p.flightLevel.toLocaleString()}ft` : '';
          items.push(`<div class="notam-item" style="border-left-color:${p.urgent ? '#c62828' : '#78909c'};">` +
            `<span class="notam-airport">${p.urgent ? 'URGENT PIREP' : 'PIREP'}${esc(fl)}</span> — ` +
            `<span style="font-family:ui-monospace,Consolas,monospace;font-size:12px;">${esc(p.raw || '')}</span></div>`);
        }
        if (pr.length > 6) {
          items.push(`<div class="notam-item" style="color:#8a93a0;">` +
            `…and ${pr.length - 6} more pilot reports on route.</div>`);
        }
        if (!items.length) {
          items.push(`<div class="notam-item">No SIGMETs, G-AIRMETs or Center Weather ` +
                     `Advisories within ${esc(hz.corridorNm)}nm of the route.</div>`);
        }
        if (hz.partial) {
          items.push(`<div class="notam-item" style="border-left-color:#f9a825;">` +
            `${esc(hz.partial.join(' and '))} source unavailable — this list may be incomplete.</div>`);
        }
        hazardHtml = items.join('');
      }

      document.getElementById('briefingRender').innerHTML = `
        ${route ? `<div class="section"><div class="section-title">Flight</div>
          <div class="notam-item">${esc(w.departure?.airport || '')} →
          ${esc(w.arrival?.airport || '')} · ${route}</div></div>` : ''}

        <div class="section">
          <div class="section-title">Adverse conditions</div>
          ${hazardHtml}
        </div>

        <div class="section">
          <div class="section-title">Weather — surface</div>
          ${stationCard('Departure', w.departure?.airport || '—', w.departure?.metar, w.departure?.taf)}
          ${stationCard('Arrival', w.arrival?.airport || '—', w.arrival?.metar, w.arrival?.taf)}
        </div>

        ${(() => {
          const rw = data.routeWeather;
          if (!rw) return '';
          let body;
          if (!rw.available) {
            body = `<div class="notam-item">Enroute stations not checked ` +
                   `<span style="color:#8a93a0;">(${esc(rw.reason || 'no data')})</span></div>`;
          } else if (!rw.stations.length) {
            body = `<div class="notam-item">No reporting stations inside the route corridor.</div>`;
          } else {
            const rows = rw.stations.map(s => {
              const bits = [];
              if (s.visib != null) bits.push(`${s.visib} SM`);
              if (s.wxString) bits.push(s.wxString);
              if (s.offRouteNm != null) bits.push(`${Math.round(s.offRouteNm)} nm off track`);
              const cat = s.fltCat || 'NA';
              return `<div class="notam-item" style="display:flex;gap:10px;align-items:center;">` +
                `<span class="cat cat-${esc(cat)}">${esc(cat)}</span>` +
                `<span class="notam-airport">${esc(s.icao || '')}</span>` +
                `<span style="color:#5a6472;">${esc(bits.join(' · '))}</span></div>`;
            }).join('');
            const extra = rw.total > rw.stations.length
              ? `<div class="notam-item" style="color:#8a93a0;">…${rw.total - rw.stations.length} further stations in corridor.</div>`
              : '';
            body = rows + extra;
          }
          const label = rw.available && rw.belowVfr
            ? `Enroute stations — ${rw.belowVfr} below VFR`
            : 'Enroute stations';
          return `<div class="section"><div class="section-title">${esc(label)}</div>${body}</div>`;
        })()}

        <div class="section">
          <div class="section-title">Winds &amp; temps aloft</div>
          ${windCard('Departure', winds.departure)}
          ${windCard('Arrival', winds.arrival)}
        </div>

        <div class="section">
          <div class="section-title">NOTAMs
            ${notamsMock ? '<span class="badge-mock">PLACEHOLDER DATA</span>' : ''}
          </div>
          ${notamHtml}
        </div>

        <div class="section">
          <div class="section-title">Airspace
            ${sua.source === 'placeholder' ? '<span class="badge-mock">NOT CHECKED</span>' : ''}
          </div>
          <div class="notam-item">${esc(sua.message || 'No data')}</div>
        </div>

        <div class="section">
          <div class="section-title">Advisory</div>
          <div class="advisory">
            ${cats.length ? `<strong>Reported flight category:</strong> ${esc(cats.join(' / '))}.<br>` : ''}
            This is <strong>not an official FAA weather briefing</strong> and does not
            substitute for one. The pilot in command is responsible for the go/no-go decision.
          </div>
        </div>`;
    }

    document.getElementById('toggleRaw').addEventListener('click', (e) => {
      const el = document.getElementById('briefingText');
      const open = el.style.display !== 'none';
      el.style.display = open ? 'none' : 'block';
      e.target.textContent = open ? 'Show full briefing text ▾' : 'Hide full briefing text ▴';
    });

    // ---- voice ----------------------------------------------------------
    // Speaks data.voice (the phraseology rendering built server-side), never the
    // written briefing — raw METAR strings are unlistenable.
    let lastVoice = null;
    let spokenAutomatically = false;

    function speak(text) {
      if (!('speechSynthesis' in window) || !text) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;   // briefer pace; slower drags on a 200-word briefing
      u.pitch = 1.0;
      speechSynthesis.speak(u);
    }

    document.getElementById('speakButton').addEventListener('click', () => {
      // Fall back to the written text only if no spoken rendering came back.
      speak(lastVoice || document.getElementById('briefingText').textContent);
    });

    // Spoken route -> form fields. Shows what it heard so a mishear is visible
    // and correctable rather than silently briefing the wrong route.
    const NATO_LETTER = {
      alpha:'A', bravo:'B', charlie:'C', delta:'D', echo:'E', foxtrot:'F', golf:'G',
      hotel:'H', india:'I', juliet:'J', juliett:'J', kilo:'K', lima:'L', mike:'M',
      november:'N', oscar:'O', papa:'P', quebec:'Q', romeo:'R', sierra:'S',
      tango:'T', uniform:'U', victor:'V', whiskey:'W', xray:'X', yankee:'Y', zulu:'Z'
    };
    const CITY_ICAO = {
      // GA fields first — Flight Service's actual users fly these, not the hubs.
      'denton':'KDTO', 'denton enterprise':'KDTO',
      'addison':'KADS', 'meacham':'KFTW', 'fort worth':'KFTW',
      'arlington':'KGKY', 'waco':'KACT', 'abilene':'KABI',
      'durant':'KDUA', 'ardmore':'KADM', 'sherman':'KGYI',
      'oklahoma city':'KOKC', 'will rogers':'KOKC', 'okc':'KOKC',
      'dallas fort worth':'KDFW', 'dallas':'KDFW', 'dfw':'KDFW',
      'minneapolis':'KMSP', 'minneapolis saint paul':'KMSP', 'msp':'KMSP',
      'chicago':'KORD', "o'hare":'KORD', 'ohare':'KORD',
      'denver':'KDEN', 'atlanta':'KATL', 'new york':'KJFK', 'kennedy':'KJFK',
      'los angeles':'KLAX', 'lax':'KLAX', 'houston':'KIAH', 'phoenix':'KPHX',
      'seattle':'KSEA', 'miami':'KMIA', 'boston':'KBOS', 'detroit':'KDTW',
      'las vegas':'KLAS', 'oklahoma city':'KOKC', 'kansas city':'KMCI',
      'saint louis':'KSTL', 'st louis':'KSTL', 'tulsa':'KTUL', 'austin':'KAUS',
      'san antonio':'KSAT', 'nashville':'KBNA', 'memphis':'KMEM'
    };
    const WORD_DIGIT = { zero:'0', oh:'0', one:'1', two:'2', three:'3', four:'4',
                         five:'5', six:'6', seven:'7', eight:'8', nine:'9', niner:'9' };

    function icaoFromPhrase(phrase) {
      const p = phrase.trim().toLowerCase().replace(/[^a-z' ]/g, '');
      if (!p) return null;
      if (CITY_ICAO[p]) return CITY_ICAO[p];

      // NATO spelling, e.g. "kilo delta foxtrot whiskey"
      const words = p.split(/\s+/);
      const letters = words.map(w => NATO_LETTER[w]).filter(Boolean);
      if (letters.length >= 3 && letters.length === words.length) return letters.join('');

      // Bare letters, e.g. "k d f w"
      if (words.length >= 3 && words.every(w => w.length === 1)) {
        return words.join('').toUpperCase();
      }
      // Longest city match inside a looser phrase
      for (const key of Object.keys(CITY_ICAO).sort((a, b) => b.length - a.length)) {
        if (p.includes(key)) return CITY_ICAO[key];
      }
      return null;
    }

    function altitudeFromSpeech(s) {
      // "flight level three zero zero" -> 30000
      const fl = /flight level ((?:\w+\s*){1,3})/.exec(s);
      if (fl) {
        const digits = fl[1].trim().split(/\s+/).map(w => WORD_DIGIT[w] ?? (/^\d$/.test(w) ? w : null));
        if (digits.length === 3 && digits.every(Boolean)) return Number(digits.join('')) * 100;
        const n = parseInt(fl[1].replace(/\D/g, ''), 10);
        if (Number.isFinite(n)) return n * 100;
      }
      // "eight thousand", "twelve thousand five hundred", "at 8000"
      const th = /(\d{1,2})\s*thousand/.exec(s);
      if (th) return Number(th[1]) * 1000;
      const plain = /\b(\d{3,5})\s*(?:feet|ft)?\b/.exec(s);
      if (plain) return Number(plain[1]);
      return null;
    }

    function parseSpokenFlight(transcript) {
      const s = transcript.toLowerCase();
      const out = {};

      const leg = /(?:from\s+)?(.+?)\s+(?:to|too|two)\s+(.+?)(?:\s+at\s+|\s+in\s+a\s+|$)/.exec(s);
      if (leg) {
        out.departure = icaoFromPhrase(leg[1]);
        out.arrival = icaoFromPhrase(leg[2].replace(/\s+at\s+.*$/, ''));
      }
      out.altitude = altitudeFromSpeech(s);
      return out;
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('micBtn');
    const micLabel = document.getElementById('micLabel');
    const heardEl = document.getElementById('heard');
    const hintEl = document.getElementById('voiceHint');

    if (!SR) {
      micBtn.disabled = true;
      micLabel.textContent = 'Voice input not supported in this browser';
      hintEl.textContent = 'Chrome, Edge and Safari support speech input.';
    } else {
      const rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      let listening = false;

      micBtn.addEventListener('click', () => {
        if (listening) { rec.stop(); return; }
        heardEl.hidden = true;
        speechSynthesis.cancel();
        try { rec.start(); } catch (e) { /* already starting */ }
      });

      rec.addEventListener('start', () => {
        listening = true;
        micBtn.classList.add('listening');
        micLabel.textContent = 'Listening — tap to stop';
      });

      rec.addEventListener('end', () => {
        listening = false;
        micBtn.classList.remove('listening');
        micLabel.textContent = 'Speak your flight';
      });

      rec.addEventListener('error', (e) => {
        heardEl.hidden = false;
        heardEl.textContent = e.error === 'not-allowed'
          ? 'Microphone permission denied — enable it to use voice input.'
          : `Speech input error: ${e.error}`;
      });

      rec.addEventListener('result', (e) => {
        const transcript = e.results[0][0].transcript;
        heardEl.hidden = false;
        heardEl.textContent = `Heard: “${transcript}”`;

        const p = parseSpokenFlight(transcript);
        const applied = [];
        if (p.departure) { document.getElementById('departure').value = p.departure; applied.push(p.departure); }
        if (p.arrival) { document.getElementById('arrival').value = p.arrival; applied.push(p.arrival); }
        if (p.altitude) { document.getElementById('altitude').value = p.altitude; }

        if (applied.length === 2) {
          heardEl.textContent += ` → ${applied[0]} to ${applied[1]}` +
            (p.altitude ? ` at ${p.altitude.toLocaleString()} ft` : '');
          spokenAutomatically = true;
          document.getElementById('briefingForm').requestSubmit();
        } else {
          heardEl.textContent += ' — could not identify both airports. ' +
            'Try spelling them, e.g. “kilo delta foxtrot whiskey to kilo mike sierra papa”.';
        }
      });
    }

    // Initialize on load
    detectLocation();
  </script>
</body>
</html>
